[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "lease-plan-check"
version = "0.1.0"
description = "Evidence-linked lease plan check with deterministic checks and review"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pydantic>=2.10,<3", "shapely>=2.0,<3", "numpy>=1.24,<3", "pillow>=10.1,<13"]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
[project.scripts]
lease-plan-check = "lease_plan_check.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
lease_plan_check = ["assets/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
